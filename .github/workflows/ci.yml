name: ci

on:
  pull_request:
  push:
    branches: [main]

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, que não aparece em nenhum destes workflows.
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Guarda de travamento. O DETECTOR de crescimento é o passo `Orçamento de
    # tempo` no fim deste job; a medição que justifica o 25 está em `TETOS`, em
    # tests/unit/preambulo-do-ci-nao-come-o-relogio.test.ts — que é quem cobra
    # razão escrita, e é lá que ela não se perde.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Marcar o início (o orçamento de tempo mede no fim do job)
        run: echo "VERIFY_INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      # Auditoria de autorização e papel: impede comparações diretas de papel
      # fora de lib/auth/ que contornem o gate de MFA e requireRole().
      - name: Role rank audit
        run: pnpm lint:role-rank

      # O merge LIMPO não chama hook nenhum: dois PRs com migrations de nomes
      # diferentes não conflitam textualmente, o commit nasce sem `pre-commit` e o
      # número duplicado entra calado (o #804 entrou assim com o `0241`; o `0161` foi
      # disputado por cinco PRs — issue #285). A régua por número era só hook local:
      # `core.hooksPath` é configuração local, NÃO versionada, que fork nenhum executa.
      # Step próprio, como os dois acima, porque é o CI que gateia PR — `gov:verify`
      # não é invocado por workflow nenhum. Mesma régua do hook do contribuidor,
      # contra o REMOTO (e o script busca a base: o checkout daqui não traz origin/main).
      - name: Colisão de número de migration
        run: pnpm checar:colisao-de-migration

      - name: Unit tests
        run: pnpm test:unit


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

      - name: Orçamento de tempo do verify
        if: always()
        env:
          # Orçamento em MINUTOS.
          #
          # ── ERA 16, E O 16 VEIO DE DISTRIBUIÇÃO CENSURADA ────────────────
          #
          # O 16 foi calibrado sobre "o pior sucesso medido é 14,9". Esse número
          # estava CENSURADO pelo teto de 15 que vigorava quando ele foi medido:
          # todo job que passaria de 15 morria de relógio e entrava na coluna
          # `cancelled`, não na de sucesso. Eu medi a distribuição dos
          # SOBREVIVENTES e a tratei como a distribuição dos jobs.
          #
          # Medido depois de o teto subir para 25, com a censura removida
          # (20 sucessos do `verify`, todos posteriores ao merge de 18:32:12Z):
          #
          #     mediana 14,9 · p90 15,8 · p95 15,9 · MÁX 16,0
          #     10 de 31 jobs passam de 15   ← todos morreriam no teto antigo
          #      1 de 20 sucessos passa de 16 ← o orçamento JÁ reprovava um verde
          #
          # O 19 é max + 3,0 min, com 6 min até o teto — então o orçamento
          # dispara bem ANTES do corte, que é a propriedade que faz o erro
          # legível chegar em vez do `cancelled`.
          #
          # ⚠️ A LIÇÃO DE MÉTODO, que vale mais que o número: **teto e orçamento
          # censuram a própria medição que os calibra.** Nunca derive um destes
          # dois da distribuição medida sob o valor anterior — a cauda que
          # interessa é exatamente a que foi cortada. Depois de mexer em
          # qualquer um dos dois, ESPERE a distribuição nova e recalibre.
          ORCAMENTO_MIN: "19"
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_INICIO:-}" ]; then
            echo "::warning::NÃO MEDIDO — o job não chegou a registrar o início."
            exit 0
          fi
          decorrido=$(( ($(date +%s) - VERIFY_INICIO) / 60 ))
          echo "verify: ${decorrido} min (orçamento ${ORCAMENTO_MIN} min, teto de travamento 25 min)"
          if [ "$decorrido" -le "${ORCAMENTO_MIN}" ]; then
            exit 0
          fi
          echo "::error::O verify levou ${decorrido} min contra um orçamento de ${ORCAMENTO_MIN} min."
          echo "::error::Isto NÃO é defeito do seu PR: a suíte unitária cresceu. Em 18/09/2026, \`Unit tests\` já era 10,3 dos 13,2 min do job."
          echo "::error::O conserto é repartir \`pnpm test:unit\`, não subir este número."
          exit 1

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # Cada perna sobe `pgvector/pgvector` na SUA major, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  #
  # AS DUAS MAJORS, e por que as duas (issue #454): pg15 é o PISO que dizemos
  # suportar — o piso real do `baseline.sql`, `security_invoker` em view — e é
  # onde quem digita `pnpm test:db` na própria máquina cai por padrão; pg17 é a
  # major de onde o `pg_dump` do baseline saiu e o que o Supabase entrega a
  # projeto novo. Rodar só no piso mediu uma instalação que não era a do dump;
  # rodar só na de cima era o estado até a #422. A major entra por
  # `TEST_DB_IMAGE`, a MESMA variável dos dois scripts, e o PADRÃO dela continua
  # sendo o piso (`scripts/test-db.sh`) — quem guarda isso é
  # tests/unit/baseline-no-piso-do-postgres.test.ts.
  invariants-majors:
    runs-on: ubuntu-latest
    # Eram 20 min quando a perna tinha UMA passada; agora ela tem duas
    # (`test:db` + `test:db:update`) e o teto acompanha. O 30 é DECLARADO, não
    # medido — não há Docker onde esta matriz foi escrita —, e existe para o
    # vermelho continuar falando de schema: mantido em 20, a perna morreria por
    # relógio no meio da segunda passada.
    timeout-minutes: 30
    strategy:
      # `false` e não o padrão (`true`): com `fail-fast`, a primeira major que
      # reprovasse CANCELARIA a outra e o relatório diria "cancelled" em vez de
      # medir as duas. Cobertura declarada que o CI cancela é o modo de falha
      # que esta issue existe para fechar.
      fail-fast: false
      matrix:
        pg: ["15", "17"]
    env:
      # Uma variável, os dois scripts: `scripts/test-db.sh` e
      # `scripts/test-update-com-dados.sh` leem esta para escolher a imagem.
      TEST_DB_IMAGE: pgvector/pgvector:pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: RLS isolation + governance invariants (pg${{ matrix.pg }})
        run: pnpm test:db

      # O `update.sh` do cliente roda sobre um banco COM DADOS, e nenhum gate
      # exercitava isso: `test:db` aplica o baseline num banco VAZIO, então
      # constraint que só quebra com linha existente passava verde (é o achado
      # que o cabeçalho de scripts/test-update-com-dados.sh mede). O script
      # existia desde 2026-08-27 e NENHUM workflow o chamava (issue #454): aqui
      # ele passa a ser gate, nas duas majors, pela mesma variável de imagem.
      - name: update.sh sobre banco COM DADOS (pg${{ matrix.pg }})
        run: pnpm test:db:update

  # O NOME DESTE JOB É O CHECK OBRIGATÓRIO, e é por isso que ele existe — mesmo
  # padrão do `e2e` em e2e.yml e do `imagens-ok` em publish-image.yml.
  #
  # A branch protection da `main` exige um check chamado exatamente `invariants`
  # (a lista dos cinco — `verify, build-and-size, invariants, e2e, imagens-ok` —
  # está na triagem do CI; token de fork não lê branch protection pela API, e por
  # isso ela é citada, não remedida aqui). Job de matrix se
  # chama `invariants-majors (15)` e `invariants-majors (17)`: se a matriz
  # tivesse ficado com o nome `invariants`, a proteção passaria a esperar para
  # sempre um check que nenhum run produz, e NENHUM PR mergearia.
  invariants:
    if: always()
    needs: [invariants-majors]
    runs-on: ubuntu-latest
    # Nenhuma permissão: este job só lê o resultado de `needs`.
    permissions: {}
    steps:
      - name: Falhar se qualquer major não passou
        run: |
          echo "invariants-majors: ${{ needs.invariants-majors.result }}"
          # `success` é o único desfecho aceito: o agregado de uma matrix só é
          # `success` com TODAS as pernas verdes, então uma major sozinha
          # reprovando derruba o check obrigatório. `skipped` também reprova, de
          # propósito — perna pulada não mediu nada.
          [ "${{ needs.invariants-majors.result }}" = "success" ]
